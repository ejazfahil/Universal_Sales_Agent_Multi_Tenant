name: CI

on:
  push: {branches: [main]}
  pull_request: {branches: [main]}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy --strict app/

      - name: Tests
        run: uv run pytest -q

      # Invariant I6: no emotion or sentiment inference in the EU path.
      - name: Guard — no sentiment inference
        run: |
          if grep -rniE 'sentiment|emotion' app/ --include='*.py'; then
            echo "::error::Invariant I6 violated: emotion/sentiment inference found in app/"
            exit 1
          fi
          echo "I6 clean — no emotion inference in app/"
